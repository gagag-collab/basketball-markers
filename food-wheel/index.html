<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf6ee"><title>今天吃点啥 · 随心转盘</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;--ink:#282a24;--muted:#77796b;--green:#384e3c;--line:#e5e4d9;--cream:#faf6ee}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d0983f;outline-offset:3px}header{max-width:1200px;margin:auto;padding:28px 32px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:10px}.brand-icon{background:var(--green);color:#fff;border-radius:12px;width:37px;height:37px;display:grid;place-items:center;font-size:24px}header small{color:var(--muted)}main{max-width:1150px;margin:22px auto 50px;padding:0 32px}.intro{margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:3px;font-weight:700;color:#797f64}.intro h1{font-size:clamp(32px,5vw,52px);letter-spacing:-2px;margin:12px 0 10px;line-height:1.25}.intro h1 span{color:#778153}.intro p{color:var(--muted);font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(300px,.8fr);gap:36px;align-items:start}.wheel-card{position:relative;min-width:0;background:#f0efe3;border:1px solid #e5e4d7;border-radius:28px;padding:24px;text-align:center;overflow:hidden}.wheel-top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#69715a}.tag{background:#fff9;border-radius:30px;padding:7px 12px}.wheel-wrap{position:relative;width:min(100%,440px);aspect-ratio:1;margin:20px auto 10px}.wheel-wrap svg{width:100%;height:100%;filter:drop-shadow(0 12px 12px #4c543123)}#rotor{transform-origin:240px 240px}.pointer{position:absolute;left:calc(50% - 13px);top:1px;width:26px;height:38px;background:var(--green);clip-path:polygon(0 0,100% 0,100% 45%,50% 100%,0 45%);z-index:3}.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:74px;width:74px;border-radius:50%;border:7px solid #fff4da;background:var(--green);color:white;box-shadow:0 2px 8px #0002;display:grid;place-items:center;font-size:22px;font-weight:800}.primary{border:0;border-radius:14px;background:var(--green);color:#fff;padding:15px 26px;font-weight:600;transition:transform .2s}.primary:hover{transform:translateY(-2px);background:#28422d}#spin{min-width:210px;font-size:16px}.hint{font-size:12px;color:#7c806b;margin:13px 0 0}.side{background:#fffdf8;border:1px solid var(--line);border-radius:24px;padding:24px}.side h2{font-size:19px;margin:0}.heading-row{display:flex;align-items:center;justify-content:space-between}.count{font-size:12px;color:var(--muted);background:#f1f1e9;padding:5px 9px;border-radius:20px}.tabs{display:flex;background:#eeeee5;padding:4px;border-radius:12px;margin:20px 0}.tab{flex:1;border:0;background:none;padding:10px;border-radius:9px;color:#6c6e60;font-size:13px}.tab[aria-pressed=true]{background:#fffdf8;color:var(--green);box-shadow:0 2px 5px #00000008;font-weight:700}.entry{display:flex;gap:8px;margin-bottom:15px}.entry input{width:100%;min-width:0;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px;font-size:13px}.add{border:0;background:#e8ecdf;color:var(--green);border-radius:10px;width:46px;flex-shrink:0;font-size:24px}.list{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow:auto;padding:3px}.item{display:flex;align-items:center;gap:10px;border-radius:10px;background:#f5f5ed;padding:8px 10px}.swatch{height:9px;width:9px;border-radius:50%;flex:none}.item input{border:0;background:transparent;min-width:0;width:100%;padding:3px 0;color:var(--ink);font-size:13px}.remove{border:0;background:none;color:#a2a391;font-size:22px;line-height:1;padding:2px 5px}.remove:hover{color:#9e4335}.tools{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.text-button{border:0;background:none;color:#6c7657;font-size:12px;padding:5px 0;text-decoration:underline;text-underline-offset:4px}.save-note{border-top:1px solid var(--line);padding-top:17px;margin:18px 0 0;font-size:11px;color:var(--muted)}.result{display:flex;align-items:center;gap:18px;background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:18px 22px;margin-top:22px}.result-icon{width:42px;height:42px;display:grid;place-items:center;background:#eee9d7;border-radius:13px;font-size:24px}.result small{font-size:11px;color:var(--muted)}#result{font-size:20px;font-weight:700;margin-top:3px}.history{margin-top:25px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}.history span{padding:6px 11px;background:#eceee3;border-radius:20px;color:#657050}.footer{max-width:1150px;margin:24px auto;padding:0 32px 26px;display:flex;justify-content:space-between;font-size:11px;color:#999b8d}dialog{border:1px solid var(--line);border-radius:22px;width:min(90%,440px);padding:28px;background:#fffdf8;color:var(--ink)}dialog::backdrop{background:#26322666;backdrop-filter:blur(4px)}dialog h2{margin-top:0}dialog p{font-size:13px;color:var(--muted)}textarea{resize:vertical;width:100%;height:210px;border:1px solid var(--line);border-radius:10px;padding:12px}.dialog-actions{display:flex;justify-content:flex-end;gap:18px;margin-top:18px}.error{color:#a04735;font-size:12px;min-height:18px;margin:8px 0}#confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.particle{position:absolute;width:9px;height:14px;top:35%;left:50%;animation:scatter 1.1s ease-out forwards}@keyframes scatter{to{transform:translate(var(--dx),var(--dy)) rotate(var(--dr));opacity:0}}@media(max-width:760px){header{padding:20px}header small{font-size:10px}.brand{font-size:17px}main{padding:0 18px;margin-top:16px}.intro{margin-bottom:22px}.layout{grid-template-columns:1fr;gap:20px}.wheel-card{padding:18px}.wheel-wrap{max-width:380px;margin-top:16px}.side{padding:20px}.footer{padding:0 20px 20px}.intro h1{letter-spacing:-1px}.list{max-height:280px}}@media(prefers-reduced-motion:reduce){.particle{animation:none}.primary{transition:none}}
</style></head><body>
<header><div class="brand"><span class="brand-icon">✳</span>随心转盘</div><small>把纠结，交给一点随机。</small></header>
<main><section class="intro"><div class="eyebrow">A LITTLE SPIN, A LITTLE SURPRISE</div><h1 id="title">今天<span>吃点啥？</span></h1><p id="subtitle">选择困难的日常，用一个转盘轻松解决。</p></section>
<div class="layout"><section><div class="wheel-card"><div class="wheel-top"><span class="tag" id="wheel-tag">✦ 美食灵感</span><span>每个选项 · 等概率</span></div><div class="wheel-wrap"><div class="pointer"></div><svg viewBox="0 0 480 480" role="img" aria-label="随机选择转盘"><circle cx="240" cy="240" r="232" fill="#fff9eb"/><g id="rotor"></g><circle cx="240" cy="240" r="222" fill="none" stroke="#fff8e4" stroke-width="3"/></svg><div class="hub">转</div></div><button class="primary" id="spin">转一下，帮我选 ↗</button><p class="hint" id="hint">不想纠结，就听这一次转盘的。</p><div id="confetti"></div></div><div class="result"><div class="result-icon" id="result-icon">✧</div><div><small id="result-label">今天的小决定</small><div id="result" aria-live="polite">好选择，马上就来。</div></div></div><div class="history" id="history"><label>最近选中</label></div></section>
<section class="side"><div class="heading-row"><h2>我的选项</h2><span class="count" id="count">8 个选项</span></div><div class="tabs"><button class="tab" data-mode="food" aria-pressed="true">🍜 今天吃什么</button><button class="tab" data-mode="stuff" aria-pressed="false">🎁 自定义物品</button></div><form class="entry" id="add-form"><input id="new-item" maxlength="20" placeholder="输入食物，按回车添加" aria-label="新选项" autocomplete="off"><button class="add" aria-label="添加选项" type="submit">＋</button></form><div class="list" id="list"></div><div class="error" id="error" role="status"></div><div class="tools"><button class="text-button" id="bulk">批量编辑</button><button class="text-button" id="restore">恢复默认选项</button></div><p class="save-note" id="save-note">✓ 修改自动保存至当前浏览器 · 最多 24 项</p></section></div></main>
<footer class="footer"><span>随心选择，认真生活。</span><span>MADE FOR YOUR EVERYDAY</span></footer>
<dialog id="bulk-dialog"><h2>一次放进所有灵感</h2><p>每行一个选项，最多 24 项，每项最多 20 字。</p><textarea id="bulk-input" aria-label="批量选项"></textarea><p class="error" id="bulk-error"></p><div class="dialog-actions"><button class="text-button" id="cancel-bulk">取消</button><button class="primary" id="save-bulk">保存选项</button></div></dialog>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),defaults={food:['火锅','麻辣烫','寿司','汉堡','牛肉面','披萨','饺子','家常菜'],stuff:['一本好书','一杯咖啡','一束鲜花','一件新衣','一场电影','一份甜点']},colors=['#d8e2bb','#f5d18e','#dbbfb0','#b8cfc1','#e4daa7','#c2cbd6','#ecc8b0','#c9d2ab'];let state={mode:'food',lists:structuredClone(defaults),history:{food:[],stuff:[]}},spinning=false,rotation=0;
try{const s=JSON.parse(localStorage.getItem('choice-wheel-v1'));if(s&&['food','stuff'].includes(s.mode)&&s.lists&&s.history){for(const m of ['food','stuff']){if(Array.isArray(s.lists[m])&&s.lists[m].length<=24&&s.lists[m].every(x=>typeof x==='string'&&x.trim()&&x.length<=20))state.lists[m]=s.lists[m];if(Array.isArray(s.history[m]))state.history[m]=s.history[m].filter(x=>typeof x==='string').slice(0,5)}state.mode=s.mode}}catch{}
const items=()=>state.lists[state.mode];function save(){try{localStorage.setItem('choice-wheel-v1',JSON.stringify(state))}catch{$('save-note').textContent='当前浏览器无法保存；离开页面后选项可能丢失。'}}function err(s=''){$('error').textContent=s}function svg(tag,attrs,text){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n}
function wheel(){const a=items(),g=$('rotor');g.replaceChildren();g.style.transition='none';rotation=0;g.style.transform='rotate(0deg)';if(!a.length){g.append(svg('circle',{cx:240,cy:240,r:220,fill:'#e4e6d8'}));return}const step=2*Math.PI/a.length;a.forEach((name,i)=>{const start=-Math.PI/2+i*step,end=start+step;const x=t=>240+220*Math.cos(t),y=t=>240+220*Math.sin(t);if(a.length===1)g.append(svg('circle',{cx:240,cy:240,r:220,fill:colors[0]}));else g.append(svg('path',{d:`M240,240 L${x(start)},${y(start)} A220,220 0 ${step>Math.PI?1:0} 1 ${x(end)},${y(end)} Z`,fill:colors[i%colors.length],stroke:'#fff8e4','stroke-width':2}));const mid=start+step/2,angle=mid*180/Math.PI;const label=name.length>9?name.slice(0,8)+'…':name;const t=svg('text',{x:382,y:240,transform:`rotate(${angle} 240 240)`,'text-anchor':'middle','dominant-baseline':'middle',fill:'#343c2e','font-size':a.length>16?12:16,'font-weight':600},label);const title=svg('title',{},name);t.append(title);g.append(t)})}
function render(){const a=items(),food=state.mode==='food';$('title').innerHTML=food?'今天<span>吃点啥？</span>':'这次<span>选什么？</span>';$('subtitle').textContent=food?'选择困难的日常，用一个转盘轻松解决。':'礼物、活动、小物件，把你的灵感放进来。';$('wheel-tag').textContent=food?'✦ 美食灵感':'✦ 随心好物';$('new-item').placeholder=food?'输入食物，按回车添加':'输入物品或活动，按回车添加';$('count').textContent=a.length+' 个选项';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));$('list').replaceChildren();a.forEach((name,i)=>{const row=document.createElement('div');row.className='item';const dot=document.createElement('span');dot.className='swatch';dot.style.background=colors[i%colors.length];const input=document.createElement('input');input.value=name;input.maxLength=20;input.setAttribute('aria-label','选项 '+(i+1));input.addEventListener('change',()=>{const v=input.value.trim();if(!v){input.value=name;err('选项不能为空；不需要的选项可以点 × 删除。');return}if(a.some((x,j)=>x===v&&j!==i)){input.value=name;err('这个选项已经在转盘里了。');return}a[i]=v;save();wheel();err()});const remove=document.createElement('button');remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','删除 '+name);remove.onclick=()=>{a.splice(i,1);save();render()};row.append(dot,input,remove);$('list').append(row)});$('spin').disabled=a.length===0;$('hint').textContent=a.length?'不想纠结，就听这一次转盘的。':'先添加至少一个选项，再开始转盘。';$('history').replaceChildren();const label=document.createElement('label');label.textContent='最近选中';$('history').append(label);for(const name of state.history[state.mode]){const chip=document.createElement('span');chip.textContent=name;$('history').append(chip)}if(!state.history[state.mode].length){const t=document.createTextNode('还没有，转一次试试');$('history').append(t)}wheel();err()}
function lock(yes){document.querySelectorAll('.side button,.side input').forEach(b=>b.disabled=yes);$('spin').disabled=yes||!items().length}function randomIndex(n){const max=4294967296,limit=max-max%n;let x;do{x=crypto.getRandomValues(new Uint32Array(1))[0]}while(x>=limit);return x%n}
$('spin').onclick=()=>{if(spinning||!items().length)return;spinning=true;lock(true);const a=items(),index=randomIndex(a.length),step=360/a.length,desired=(360-(index+.5)*step)%360,current=((rotation%360)+360)%360,delta=(desired-current+360)%360;rotation+=360*6+delta;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,duration=reduced?0:4200;$('result').textContent='转盘正在挑选…';$('result-label').textContent='给好运一点时间';$('spin').textContent='正在转动…';const g=$('rotor');g.style.transition=`transform ${duration}ms cubic-bezier(.12,.72,.12,1)`;g.getBoundingClientRect();g.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{const winner=a[index];$('result').textContent=winner;$('result-label').textContent=state.mode==='food'?'今天就吃这个！':'这次就选它！';$('result-icon').textContent=state.mode==='food'?'🍽':'🎉';state.history[state.mode]=[winner,...state.history[state.mode]].slice(0,5);save();const history=$('history');history.replaceChildren();const l=document.createElement('label');l.textContent='最近选中';history.append(l);state.history[state.mode].forEach(x=>{const s=document.createElement('span');s.textContent=x;history.append(s)});spinning=false;lock(false);$('spin').textContent='再转一次 ↗';if(!reduced)celebrate()},duration+80)};
function celebrate(){for(let i=0;i<28;i++){const p=document.createElement('i');p.className='particle';p.style.background=colors[i%colors.length];p.style.setProperty('--dx',(Math.random()-.5)*500+'px');p.style.setProperty('--dy',(Math.random()*400-160)+'px');p.style.setProperty('--dr',Math.random()*700+'deg');$('confetti').append(p);setTimeout(()=>p.remove(),1200)}}
$('add-form').onsubmit=e=>{e.preventDefault();if(spinning)return;const v=$('new-item').value.trim();if(!v){err('先写下一个选项吧。');return}if(items().length>=24){err('最多放 24 个选项，请先删除一些。');return}if(items().includes(v)){err('这个选项已经在转盘里了。');return}items().push(v);$('new-item').value='';save();render();$('new-item').focus()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{if(spinning)return;state.mode=b.dataset.mode;save();render();$('result').textContent='好选择，马上就来。';$('result-label').textContent='今天的小决定';$('spin').textContent='转一下，帮我选 ↗'});
$('restore').onclick=()=>{state.lists[state.mode]=[...defaults[state.mode]];save();render()};$('bulk').onclick=()=>{$('bulk-input').value=items().join('\n');$('bulk-error').textContent='';$('bulk-dialog').showModal()};$('cancel-bulk').onclick=()=>$('bulk-dialog').close();$('save-bulk').onclick=()=>{const raw=$('bulk-input').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(raw.length>24){$('bulk-error').textContent='最多 24 项，请减少一些。';return}if(raw.some(x=>x.length>20)){$('bulk-error').textContent='每个选项最多 20 字，请缩短长选项。';return}state.lists[state.mode]=[...new Set(raw)];save();render();$('bulk-dialog').close()};render();})();
</script></body></html>
